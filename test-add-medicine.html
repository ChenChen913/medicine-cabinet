<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" disablement="width=device-width, initial-scale=1.0">
    <title>测试添加药品</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>测试添加药品</h1>
    <form id="medicineForm">
        <div class="form-group">
            <label for="name">药品名称:</label>
            <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
            <label for="unit">单位:</label>
            <input type="text" id="unit" name="unit" required>
        </div>
        
        <div class="form-group">
            <label for="dosageForm">剂型:</label>
            <select id="dosageForm" name="dosageForm">
                <option value="tablet">片剂</option>
                <option value="capsule">胶囊</option>
                <option value="syrup">口服液</option>
                <option value="injection">注射剂</option>
                <option value="ointment">外用药膏</option>
                <option value="other">其他</option>
            </select>
        </div>
        
        <button type="submit">添加药品</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('medicineForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const medicine = {};
            
            for (let [key, value] of formData.entries()) {
                medicine[key] = value;
            }
            
            // 发送POST请求
            fetch('http://localhost:8080/api/medicines', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(medicine)
            })
            .then(response => response.json())
            .then(data => {
                const resultDiv = document.getElementById('result');
                if (data.code === 200) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = '药品添加成功!\n\n' + JSON.stringify(data, null, 2);
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = '添加失败: ' + data.message;
                }
            })
            .catch(error => {
                const resultDiv = document.getElementById('result');
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '网络错误: ' + error;
            });
        });
    </script>
</body>
</html>
